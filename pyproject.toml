[project]
name = "millia-glasses"
version = "0.1.0"
description = "Millia on smart glasses: the laptop-as-phone host, the ear, the lens window, and the Halo Lua app. The brain is the millia backend (ADR 0036)."
requires-python = ">=3.13"
dependencies = [
    "brilliant-msg>=7.1.1",
    "halo-emulator>=2.0.1",
    "faster-whisper>=1.1",
    "openai>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "sounddevice>=0.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0.0", "ruff>=0.5", "mypy>=1.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
strict = true
explicit_package_bases = true
